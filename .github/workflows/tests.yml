name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests web (ignorés si web/tests est absent)
        run: |
          if ls web/tests/*.test.mjs >/dev/null 2>&1; then
            cd web && node --test "tests/*.test.mjs"
          else
            echo "pas de tests web, ignoré"
          fi
